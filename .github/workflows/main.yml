name: Build Switch 2 IPA

on:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Free Up macOS Disk Space
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/* || true
          sudo rm -rf ~/Library/Caches/* || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          for x in /Applications/Xcode*.app; do
            if [ "$x" != "/Applications/Xcode_27.2.app" ]; then
              echo "Removing $x"
              sudo rm -rf "$x" || true
            fi
          done
          echo "=== AFTER CLEANUP ==="
          df -h /

      - name: Check Xcode & Install Dependencies
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version
          brew install xcodegen zstd glslang
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic gdown

      - name: Clone nxnative
        run: |
          HOST="github.com"
          REPO="seedds/nxnative.git"
          git clone "https://${HOST}/${REPO}"
          cd nxnative
          python3 dm/gfx/tools/own_compilers.py --check-metal || true

      - name: Patch Missing Symbol Error
        run: |
          cd nxnative
          echo "void _probe_atrace(void) {}" > dm/ios/Sources/atrace_stub.c
          echo "void _probe_atrace(void);" >> dm/ios/Sources/front_ios.m

      - name: Download Switch 2 NUP File
        run: |
          mkdir -p ~/GameInput ~/GameOutput /tmp/nxwork
          gdown "https://drive.google.com/drive/folders/1YC0NAjFewgaRmEZYIQxC6UNhTGSNK94H" -O ~/GameInput
          ls -lh ~/GameInput

      - name: Build Standalone iOS IPA from NUP
        run: |
          cd nxnative
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          NUP_FILE=$(ls ~/GameInput/*.nup | head -n 1)
          python3 scripts/build_ipa_from_nsp.py "$NUP_FILE" --platform ios --romfs separate --no-heap-check --work-dir /tmp/nxwork -o ~/GameOutput/SwitchGame.ipa

      - name: Dump Xcode Linker Error Log
        if: failure()
        run: |
          echo "=== XCODE BUILD LOG ==="
          tail -n 100 /tmp/nxwork/*_build/ipa/build/ios/pkg/build.log || true
          echo "=== BUILD IPA LOG ==="
          tail -n 100 /tmp/nxwork/*_build/logs/build_ipa.log || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwitchGame-IPA
          path: ~/GameOutput/SwitchGame.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Collect Game Files
        run: |
          IMG=$(ls /tmp/nxwork/*_build/extract/v*/RomFS.img | sort -V | tail -n 1)
          echo "Game files: $IMG"
          mv "$IMG" ~/GameOutput/romfs.img
          ls -lh ~/GameOutput

      - name: Upload Game Files
        uses: actions/upload-artifact@v4
        with:
          name: SwitchGame-RomFS
          path: ~/GameOutput/romfs.img
          if-no-files-found: error
          retention-days: 1
