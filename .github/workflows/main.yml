name: Build Switch 2 IPA

on:
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Deep Clean Runner Disk Space
        run: |
          echo "=== BEFORE DEEP CLEAN ==="
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/* || true
          sudo rm -rf ~/Library/Caches/* || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/* || true
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /Library/Frameworks/Mono.framework || true
          KEEP_XCODE=$(readlink -f /Applications/Xcode_27.2.app || echo "/Applications/Xcode_27.2.app")
          for x in /Applications/Xcode*.app; do
            REAL_X=$(readlink -f "$x" || echo "$x")
            if [ "$REAL_X" != "$KEEP_XCODE" ] && [ ! -L "$x" ]; then
              echo "Removing unused Xcode: $x"
              sudo rm -rf "$x" || true
            fi
          done
          echo "=== AFTER DEEP CLEAN ==="
          df -h /

      - name: Check Xcode & Install Dependencies
        run: |
          ls -ld /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version
          brew install xcodegen zstd glslang
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic gdown

      - name: Clone Pristine nxnative
        run: |
          HOST="github.com"
          REPO="seedds/nxnative.git"
          git clone "https://${HOST}/${REPO}"
          cd nxnative
          python3 dm/gfx/tools/own_compilers.py --check-metal || true

      - name: Setup Global Statvfs Mock
        run: |
          python3 - << 'EOF'
          import site, pathlib
          sp = site.getsitepackages()[0]
          mock_code = """import os
          _orig_statvfs = os.statvfs
          class MockStatvfs(os.statvfs_result):
              def __getattribute__(self, name):
                  if name == "f_bavail": return 500000000
                  if name == "f_bfree": return 500000000
                  return super().__getattribute__(name)
          def _new_statvfs(path):
              return MockStatvfs(_orig_statvfs(path))
          os.statvfs = _new_statvfs
          """
          pathlib.Path(sp, "sitecustomize.py").write_text(mock_code)
          print("Successfully injected sitecustomize.py into:", sp)
          EOF
          cd nxnative
          echo "void _probe_atrace(void) {}" > dm/ios/Sources/atrace_stub.c
          echo "void _probe_atrace(void);" >> dm/ios/Sources/front_ios.m

      - name: Download Switch 2 NUP File via Buzzheavier
        run: |
          mkdir -p ~/GameInput ~/GameOutput /tmp/nxwork
          curl -L -C - --retry 5 --retry-delay 10 -o ~/GameInput/zelda.nup "https://ts.buzzheavier.com/d/2p2y2pho4ey1?v=fcL-KzbFpEn39gzCIM2JWwxRtivQ7wkWrxax6Gy9oKyYN2r4VSdkFFV1Mx2Sr8qxb80SciVpiyQCfJVF5kFlDNUaFUD9-I_lPvwax9rYjAbSeEbJLLsQHCNgPRmVqlREhRi9aafHlrguWrDivJizuQPH-qaZgeXMKVLPSEetVYz7f1cmzwBVfS_mrvyOwKEbc4lHswUhOUrJp9p7AAvcKoPJa1aHltf1ua9Gu4G5CtLpRJCa3c0YIbMN3BQSNQh88SyXpVlJQimWZo1i0rJa5h5G9MSGXYatrQ"
          ls -lh ~/GameInput

      - name: Build Standalone iOS IPA from NUP
        run: |
          cd nxnative
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          NUP_FILE=$(ls ~/GameInput/*.nup | head -n 1)
          python3 scripts/build_ipa_from_nsp.py "$NUP_FILE" --platform ios --romfs separate --no-heap-check --work-dir /tmp/nxwork -o ~/GameOutput/SwitchGame.ipa

      - name: Dump Xcode Linker Error Log
        if: failure()
        run: |
          echo "=== XCODE BUILD LOG ==="
          tail -n 100 /tmp/nxwork/*_build/ipa/build/ios/pkg/build.log || true
          echo "=== BUILD IPA LOG ==="
          tail -n 100 /tmp/nxwork/*_build/logs/build_ipa.log || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwitchGame-IPA
          path: ~/GameOutput/SwitchGame.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Collect Game Files
        run: |
          IMG=$(find /tmp/nxwork -path "*/extract/v*/RomFS.img" | sort -V | tail -n 1)
          echo "Game files: $IMG"
          mv "$IMG" ~/GameOutput/romfs.img
          ls -lh ~/GameOutput

      - name: Upload Game Files
        uses: actions/upload-artifact@v4
        with:
          name: SwitchGame-RomFS
          path: ~/GameOutput/romfs.img
          if-no-files-found: error
          retention-days: 1
